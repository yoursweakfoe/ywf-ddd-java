spring:
  main:
    allow-bean-definition-overriding: true
  threads:
    virtual:
      enabled: true
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          driver-class-name: org.h2.Driver
          url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
          username: sa
          password:
        second:
          driver-class-name: org.h2.Driver
          url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
          username: sa
          password:
      hikari:
        maximum-pool-size: 200
        minimum-idle: 5

  # 禁用 Nacos（测试环境无 Nacos Server；nacos-config 默认强制要求 spring.config.import=nacos:）
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        enabled: false

# 禁用 Seata 分布式事务（H2 不支持 AT 模式；且 TC 不可达时 Seata 启动 fail-fast）
seata:
  enabled: false

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

# 安全策略（测试环境关闭鉴权）
security:
  enabled: false
