# ============================================================================
# 开发环境配置（profile: dev）
#
# 激活方式：SPRING_PROFILES_ACTIVE=dev（ide-dev.env / docker-compose 已配置）
# 与 prod 的差异：
#   - 数据源：本文件提供本地默认值（localhost / postgres），可被同名环境变量覆盖；
#     主配置占位符无默认值，故本地开发必须激活本 profile（或显式注入全部环境变量）
#   - Actuator：与业务同端口，不拆分独立管理端口
# ============================================================================

spring:
  datasource:
    dynamic:
      datasource:
        master:
          url: ${DB_MASTER_URL:jdbc:postgresql://localhost:5432/app_master}
          username: ${DB_MASTER_USER:postgres}
          password: ${DB_MASTER_PASSWORD:postgres}
        second:
          url: ${DB_SECOND_URL:jdbc:postgresql://localhost:5432/app_second}
          username: ${DB_SECOND_USER:postgres}
          password: ${DB_SECOND_PASSWORD:postgres}

# Nacos 配置中心（二期恢复；部署多服务时启用，本地开发无需开启）
