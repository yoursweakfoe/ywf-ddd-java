# ============================================================================
# 生产环境配置（profile: prod）
#
# 激活方式：SPRING_PROFILES_ACTIVE=prod（Dockerfile 默认 / K8s 环境变量）
#
# ⚠️ 必需环境变量（主配置占位符无默认值，缺失任一即启动失败——fail-fast）：
#   DB_MASTER_URL / DB_MASTER_USER / DB_MASTER_PASSWORD
#   DB_SECOND_URL / DB_SECOND_USER / DB_SECOND_PASSWORD
#
# 与 dev 的差异：
#   - OpenAPI 文档：生产禁用
#   - Actuator：独立管理端口 + 仅 loopback 监听 + 健康详情关闭
# ============================================================================

# 生产环境禁用 OpenAPI 文档生成（springdoc）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Actuator 生产收紧：独立端口 + 仅 loopback + 健康详情关闭
management:
  server:
    port: 12569
    address: 127.0.0.1
  endpoint:
    health:
      # 覆盖主配置的 always：不向本机任意进程暴露组件内部细节（DB / 磁盘等）
      show-details: never
