syntax = "proto3";

package sampleservice.product.internal;

option java_package = "com.yoursweakfoe.sampleapplication.sampleservice.contract.product.proto";
option java_multiple_files = true;

// 东西向内部契约（演示性）：供其他服务查询商品基础信息。
// proto-first：东西向接口显式定义、显式调用，不自动暴露 REST。
service ProductInternalService {
  rpc GetProduct (GetProductInternalRequest) returns (ProductInternalInfo);
}

message GetProductInternalRequest {
  int64 product_id = 1;
}

message ProductInternalInfo {
  int64 id = 1;
  string name = 2;
  int32 stock = 3;
}
