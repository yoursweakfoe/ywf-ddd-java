spring:
  main:
    allow-bean-definition-overriding: true
  # 双 H2 源经 dynamic-datasource 路由：MybatisPersistence 多数据源路由兼容验证
  # （dynamic-datasource 为独立模块，非 MyBatis 增强的一部分，终审保留 test scope）
  # 两源刻意异质（second 为无表空库）——路由真实生效由 MybatisPersistenceTest 的
  # 「second 查 orders 必失败 / master 必成功」双向断言背书
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          driver-class-name: org.h2.Driver
          url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
          username: sa
          password:
        second:
          driver-class-name: org.h2.Driver
          # 独立空库（刻意不带 INIT 脚本）——路由证明的「异质」侧：
          # master 有业务表、second 什么都没有 ⇒ 幻影同 URL（两源同指 testdb）已根治
          url: jdbc:h2:mem:secondary;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
          username: sa
          password:

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml
